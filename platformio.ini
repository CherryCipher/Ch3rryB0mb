; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

lib_deps =
    bodmer/TFT_eSPI
    lvgl/lvgl
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

;the include for lv_conf.h is set in the library.json of the lvgl library, so we need to define this macro to include it
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -I include

;added to make sure the ESP32-2432S028 TFT display works with the TFT_eSPI library
    -DUSER_SETUP_LOADED=1

    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR ;change if your display has a different color order
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320

    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1

    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH

    -DSPI_FREQUENCY=20000000

;XPT2046 touch controller configuration
    -DTOUCH_SCLK=25
    -DTOUCH_MOSI=32
    -DTOUCH_MISO=39
    -DTOUCH_CS=33
    -DTOUCH_IRQ=36